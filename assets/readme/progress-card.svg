<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">SwirUI project progress — 68.0%</title>
  <desc id="desc">SwirUI project progress for 0.5 Alpha — Layout Engine: 68.0%, status COMPLETE, 12 / 12 layout groups verified.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02050A"/>
      <stop offset="1" stop-color="#07111C"/>
    </linearGradient>
    <linearGradient id="progressGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0088FF"/>
      <stop offset="1" stop-color="#62E5FF"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#0B3550" stroke-width="1" opacity="0.24"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .project { fill:#F4FAFF; font:700 24px 'Segoe UI',Arial,sans-serif; }
      .scope { fill:#8DA8B8; font:500 17px 'Segoe UI',Arial,sans-serif; }
      .percent { fill:#62E5FF; font:800 34px 'Segoe UI',Arial,sans-serif; }
      .meta { fill:#8DA8B8; font:600 14px 'Segoe UI',Arial,sans-serif; letter-spacing:.5px; }
      .counter { fill:#F4FAFF; font:600 14px 'Segoe UI',Arial,sans-serif; }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="178" rx="22" fill="url(#surface)" stroke="#164D6B" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="176" rx="21" fill="url(#grid)" opacity="0.65"/>
  <path d="M 28 24 H 180" stroke="#0088FF" stroke-width="3" opacity="0.75"/>
  <path d="M 1020 156 H 1170" stroke="#62E5FF" stroke-width="3" opacity="0.55"/>
  <text x="50" y="48" class="project">SwirUI</text>
<text x="50" y="76" class="scope">0.5 Alpha — Layout Engine</text>
  <text x="1150" y="50" text-anchor="end" class="percent">68.0%</text>
  <text x="1150" y="78" text-anchor="end" class="meta">PROJECT PROGRESS • COMPLETE</text>
  <rect data-role="progress-track" x="50" y="116" width="1100" height="18" rx="9" fill="#07111C" stroke="#164D6B" stroke-width="1"/>
  <rect data-role="progress-fill" x="50" y="116" width="748" height="18" rx="9" fill="url(#progressGradient)" filter="url(#softGlow)"/>
  <text x="50" y="155" class="counter">12 / 12 layout groups verified</text>
  <text x="1150" y="155" text-anchor="end" class="meta">SOURCE: ROADMAP.md • WEIGHTED VERIFIED SCOPE</text>
</svg>
