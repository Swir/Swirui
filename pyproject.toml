[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "swirui"
version = "0.1.0a1"
description = "Next-generation reactive Python UI framework"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Swir" }
]
keywords = ["gui", "ui", "python", "desktop", "reactive", "gpu", "framework"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "mypy>=1.15",
]

[project.urls]
Homepage = "https://github.com/Swir/Swirui"
Repository = "https://github.com/Swir/Swirui"
Issues = "https://github.com/Swir/Swirui/issues"
Roadmap = "https://github.com/Swir/Swirui/blob/main/ROADMAP.md"

[tool.hatch.build.targets.wheel]
packages = ["src/swirui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/swirui/platforms/windows.py" = ["SIM102"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["swirui"]
mypy_path = "src"
