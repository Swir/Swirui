[package]
name = "swirui-native"
version = "0.1.0-alpha.1"
edition = "2024"
description = "Native GPU core for the SwirUI Python framework"
license = "MIT"
publish = false

[lib]
name = "_swirui_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
glyphon = "0.12.0"
image = { version = "0.25.8", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
naga = { version = "30.0.1", features = ["wgsl-in"] }
pollster = "1.0.1"
pyo3 = { version = "0.29.2", features = ["abi3-py311"] }
raw-window-handle = "0.6.2"
resvg = "0.45.1"
serde_json = "1.0"
tiny-skia = "0.11.4"
usvg = "0.45.1"
wgpu = "30.0.1"

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "input-msmf"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "warn"
