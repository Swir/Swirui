[package]
name = "swirui-native"
version = "0.1.0-alpha.1"
edition = "2024"
description = "Native GPU core for the SwirUI Python framework"
license = "MIT"
publish = false

[lib]
name = "_swirui_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pollster = "0.4.0"
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py311"] }
raw-window-handle = "0.6.2"
wgpu = "30.0.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "warn"
