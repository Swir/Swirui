[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "swirui"
version = "0.1.0a1"
description = "Next-generation reactive Python UI framework"
requires-python = ">=3.11"
authors = [
  { name = "Swir" }
]
keywords = ["gui", "ui", "python", "desktop", "reactive", "gpu", "framework"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Swir/Swirui"
Repository = "https://github.com/Swir/Swirui"
Issues = "https://github.com/Swir/Swirui/issues"
Roadmap = "https://github.com/Swir/Swirui/blob/main/ROADMAP.md"

[tool.maturin]
bindings = "pyo3"
module-name = "_swirui_native"
python-source = "../src"
python-packages = ["swirui"]
features = ["extension-module"]
strip = true
