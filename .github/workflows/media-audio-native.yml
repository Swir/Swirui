name: Media Audio Native Gate

on:
  pull_request:
    paths:
      - "native/Cargo.toml"
      - "native/src/lib.rs"
      - "native/src/audio.rs"
      - "native/src/audio_output.rs"
      - "src/swirui/audio.py"
      - "tests/test_media_audio.py"
      - "tests/test_windows_media_audio.py"
      - "benchmarks/media_audio_timeline.py"
      - "examples/media_audio_demo.py"
      - ".github/workflows/media-audio-native.yml"
  push:
    branches:
      - main
    paths:
      - "native/Cargo.toml"
      - "native/src/lib.rs"
      - "native/src/audio.rs"
      - "native/src/audio_output.rs"
      - "src/swirui/audio.py"
      - "tests/test_media_audio.py"
      - "tests/test_windows_media_audio.py"
      - "benchmarks/media_audio_timeline.py"
      - "examples/media_audio_demo.py"
      - ".github/workflows/media-audio-native.yml"

permissions:
  contents: read

jobs:
  windows-media-audio:
    name: AudioPlayer / Rust output / Win32 / Python 3.14
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" maturin==1.15.0

      - name: Check native audio core on Windows
        run: cargo check --manifest-path native/Cargo.toml --all-targets

      - name: Test native audio core
        run: cargo test --manifest-path native/Cargo.toml audio --lib

      - name: Build PyO3 extension
        working-directory: native
        run: maturin build --release --interpreter python --out ../dist-native

      - name: Install PyO3 extension
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist-native\*.whl | Select-Object -First 1).FullName
          python -m pip install $wheel

      - name: Verify AudioPlayer package
        run: >-
          pytest tests/test_media_audio.py tests/test_windows_media_audio.py
          -q --junitxml=media-audio-pytest.xml

      - name: Benchmark native audio timeline selection
        run: python benchmarks/media_audio_timeline.py

      - name: Upload AudioPlayer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-audio-pytest-${{ github.run_id }}
          path: media-audio-pytest.xml
          if-no-files-found: ignore
          retention-days: 7
