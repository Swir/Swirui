name: SwirUI Studio Native Gate

on:
  pull_request:
    paths:
      - "src/swirui/platforms/windows_files.py"
      - "src/swirui/theme.py"
      - "tests/test_accent_authoring.py"
      - "src/swirui/surface_interaction.py"
      - "src/swirui/widgets/theme_surface.py"
      - "src/swirui/widgets/silk_ribbon.py"
      - "src/swirui/widgets/streaming_charts.py"
      - "tests/test_surface_interaction.py"
      - "tests/test_windows_surface_interaction.py"
      - "src/swirui/studio.py"
      - "src/swirui/studio_operations.py"
      - "src/swirui/studio_suite.py"
      - "src/swirui/studio_comparison.py"
      - "src/swirui/__main__.py"
      - "tests/test_studio.py"
      - "tests/test_studio_suite.py"
      - "tests/test_windows_studio.py"
      - "tests/test_windows_studio_suite.py"
      - ".github/workflows/studio-native.yml"
  push:
    branches:
      - main
    paths:
      - "src/swirui/platforms/windows_files.py"
      - "src/swirui/theme.py"
      - "tests/test_accent_authoring.py"
      - "src/swirui/surface_interaction.py"
      - "src/swirui/widgets/theme_surface.py"
      - "src/swirui/widgets/silk_ribbon.py"
      - "src/swirui/widgets/streaming_charts.py"
      - "tests/test_surface_interaction.py"
      - "tests/test_windows_surface_interaction.py"
      - "src/swirui/studio.py"
      - "src/swirui/studio_operations.py"
      - "src/swirui/studio_suite.py"
      - "src/swirui/studio_comparison.py"
      - "src/swirui/__main__.py"
      - "tests/test_studio.py"
      - "tests/test_studio_suite.py"
      - "tests/test_windows_studio.py"
      - "tests/test_windows_studio_suite.py"
      - ".github/workflows/studio-native.yml"

permissions:
  contents: read

jobs:
  windows-studio:
    name: Integrated Studio / retained wgpu / Python 3.14
    runs-on: windows-latest
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checkout provenance
        shell: pwsh
        run: |
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "Checkout mismatch: expected $expected, got $actual"
          }

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" maturin==1.15.0

      - name: Ruff
        run: >
          python -m ruff check src/swirui/studio.py src/swirui/studio_operations.py
          src/swirui/studio_suite.py src/swirui/studio_comparison.py
          src/swirui/surface_interaction.py
          src/swirui/widgets/theme_surface.py src/swirui/widgets/silk_ribbon.py
          src/swirui/widgets/streaming_charts.py
          tests/test_studio.py tests/test_studio_suite.py
          tests/test_windows_studio.py tests/test_windows_studio_suite.py
          tests/test_surface_interaction.py tests/test_windows_surface_interaction.py

      - name: Strict mypy
        run: python -m mypy --strict src/swirui/studio.py src/swirui/studio_operations.py
          src/swirui/studio_suite.py src/swirui/studio_comparison.py
          src/swirui/surface_interaction.py
          src/swirui/widgets/theme_surface.py src/swirui/widgets/silk_ribbon.py
          src/swirui/widgets/streaming_charts.py

      - name: Check native core on Windows
        run: cargo check --manifest-path native/Cargo.toml --all-targets

      - name: Build PyO3 extension
        run: maturin build --release --locked --manifest-path native/Cargo.toml --interpreter python --out dist-native

      - name: Install PyO3 extension
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem dist-native\*.whl)
          if ($wheels.Count -ne 1) { throw "Expected one Windows SwirUI wheel." }
          python -m pip install --force-reinstall --no-deps $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m swirui doctor --json

      - name: Verify integrated Studio
        run: >
          pytest tests/test_accent_authoring.py
          tests/test_material_library.py
          tests/test_surface_interaction.py tests/test_windows_surface_interaction.py
          tests/test_studio.py tests/test_studio_suite.py
          tests/test_windows_studio.py tests/test_windows_studio_suite.py -q
          --junitxml=studio-pytest.xml

      - name: Upload Studio diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-pytest-${{ github.run_id }}
          path: studio-pytest.xml
          if-no-files-found: ignore
          retention-days: 7
