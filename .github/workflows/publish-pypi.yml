name: Qualify and publish PyPI release

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.contract.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install packaging
      - id: contract
        name: Validate version and release tag
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          if [ "$EVENT" = "release" ]; then
            python tools/release_contract.py --release-tag "$RELEASE_TAG"
          else
            python tools/release_contract.py
          fi

  quality:
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy src/swirui
      - run: python -m pytest

  build-python:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build twine
      - run: python -m build --outdir dist
      - run: python -m twine check dist/*
      - name: Verify installed portable package
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python -m pip install --no-deps dist/swirui-"$VERSION"-py3-none-any.whl
          python -c "import os, swirui; assert swirui.__version__ == os.environ['VERSION']"
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-portable
          path: dist/*
          if-no-files-found: error

  build-windows-native:
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: python -m pip install maturin==1.15.0 pytest packaging
      - run: cargo test --locked --manifest-path native/Cargo.toml
      - run: maturin build --release --locked --manifest-path native/Cargo.toml --interpreter python --out dist-native
      - name: Install and verify native package
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem dist-native/*.whl)
          if ($wheels.Count -ne 1) { throw "Expected exactly one native wheel." }
          python -m pip install --no-deps $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import os, swirui; import swirui._swirui_native as core; from packaging.version import Version; assert swirui.__version__ == os.environ['VERSION']; assert Version(core.core_version()) == Version(swirui.__version__)"
      - name: Full installed-wheel tests including Windows GPU
        env:
          SWIRUI_TEST_CLIPBOARD: "1"
        run: python -m pytest --junitxml=native-results.xml -o junit_family=legacy
      - name: Verify first launch in a clean environment outside the checkout
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist-native/*.whl).FullName
          $cleanEnv = Join-Path $env:RUNNER_TEMP "swirui-beta-clean"
          python -m venv $cleanEnv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cleanPython = Join-Path $cleanEnv "Scripts/python.exe"
          & $cleanPython -m pip install --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPATH = $null
          Push-Location $env:RUNNER_TEMP
          try {
            & $cleanPython -m swirui --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $cleanPython -m swirui doctor --json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $cleanPython -m swirui demo --smoke-test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-results
          path: native-results.xml
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-windows-native
          path: dist-native/*.whl
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' && github.repository == 'Swir/Swirui'
    needs: [metadata, quality, build-python, build-windows-native]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/swirui/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: pypi-portable
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: pypi-windows-native
          path: dist
      - run: python -m pip install packaging twine
      - name: Validate exact release payload
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python tools/release_contract.py --release-tag "$RELEASE_TAG" --artifacts dist
          python -m twine check dist/*
      - name: Publish verified artifacts with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: false

  release-assets:
    if: github.event_name == 'release' && github.repository == 'Swir/Swirui'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-portable
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: pypi-windows-native
          path: dist
      - name: Attach identical artifacts without overwriting old assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*
