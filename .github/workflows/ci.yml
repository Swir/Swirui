name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-v4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python 3.11
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src/swirui

      - name: Tests
        run: pytest --cov=swirui --cov-report=term-missing

  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  linux-native:
    name: Linux X11 native smoke / Python 3.14
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install X11 runtime
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6

      - name: Install Python tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Create and exercise real X11 window
        run: xvfb-run -a pytest tests/test_linux_backend.py -q

  macos-native:
    name: macOS Cocoa native smoke / Python 3.14
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Python tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Create and exercise real Cocoa window
        run: pytest tests/test_macos_backend.py -q

  performance:
    name: Retained runtime performance / Python 3.11
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Enforce retained runtime budgets
        run: python benchmarks/retained_runtime.py --report performance-report.json

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retained-runtime-performance
          path: performance-report.json
          if-no-files-found: error
          retention-days: 14

  native-core:
    name: Native core / Rust + wgpu + PyO3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5

      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cargo check
        run: cargo check --manifest-path native/Cargo.toml --all-targets

      - name: Cargo test
        run: cargo test --manifest-path native/Cargo.toml --lib

  windows-native:
    name: Win32 + wgpu native smoke / Python 3.14
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install Python tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" maturin==1.15.0

      - name: Check native core on Windows
        run: cargo check --manifest-path native/Cargo.toml --all-targets

      - name: Build PyO3 extension
        working-directory: native
        run: maturin build --release --interpreter python --out ../dist-native

      - name: Install PyO3 extension
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist-native\*.whl | Select-Object -First 1).FullName
          python -m pip install $wheel

      - name: Create and paint real Win32 window
        run: pytest tests/test_windows_backend.py -q

      - name: Verify 0.2 integrated native gate
        run: pytest tests/test_windows_02_gate.py -q

      - name: Verify retained core widgets
        run: pytest tests/test_windows_widgets.py tests/test_windows_status_widgets.py -q

      - name: Draw native GPU scene
        run: pytest tests/test_windows_gpu_bridge.py -q

      - name: Verify GPU path rendering
        run: pytest tests/test_windows_paths.py -q

      - name: Verify GPU linear gradients
        run: pytest tests/test_windows_gradients.py -q

      - name: Verify GPU radial gradients
        run: pytest tests/test_windows_radial_gradients.py -q

      - name: Verify retained GPU shadows
        run: pytest tests/test_windows_effects.py -q

      - name: Verify retained GPU backdrop blur
        run: pytest tests/test_windows_backdrop_blur.py -q

      - name: Verify GPU color filters
        run: pytest tests/test_windows_color_filters.py -q

      - name: Verify GPU resource cache
        run: pytest tests/test_windows_resource_cache.py -q

      - name: Verify mixed-DPI GPU path
        run: pytest tests/test_windows_hidpi_gpu.py -q

      - name: Verify presentation policy
        run: pytest tests/test_windows_presentation.py -q

      - name: Verify native custom shader runtime
        run: pytest tests/test_windows_custom_shaders.py -q
