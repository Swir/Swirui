name: Native Affine Contract

on:
  push:
    branches: [main]
    paths:
      - "native/src/affine.rs"
      - "native/src/lib.rs"
      - "native/src/renderer.rs"
      - "native/src/rectangles.wgsl"
      - "native/src/shape.rs"
      - "native/src/shapes.wgsl"
      - "native/src/image.rs"
      - "native/src/images.wgsl"
      - "native/src/text.rs"
      - "src/swirui/rendering/affine.py"
      - "src/swirui/rendering/affine_wgpu_renderer.py"
      - "src/swirui/rendering/native_affine.py"
      - "src/swirui/rendering/scene.py"
      - "src/swirui/rendering/wgpu_renderer.py"
      - "src/swirui/rendering/factory.py"
      - "src/swirui/rendering/__init__.py"
      - "tests/test_affine_scene.py"
      - "tests/test_affine_compositor_traversal.py"
      - "tests/test_affine_path_renderer.py"
      - "tests/test_native_affine_contract.py"
      - "tests/test_windows_affine_contract.py"
      - "tests/test_windows_affine_paths.py"
      - ".github/workflows/affine-native.yml"
  pull_request:
    paths:
      - "native/src/affine.rs"
      - "native/src/lib.rs"
      - "native/src/renderer.rs"
      - "native/src/rectangles.wgsl"
      - "native/src/shape.rs"
      - "native/src/shapes.wgsl"
      - "native/src/image.rs"
      - "native/src/images.wgsl"
      - "native/src/text.rs"
      - "src/swirui/rendering/affine.py"
      - "src/swirui/rendering/affine_wgpu_renderer.py"
      - "src/swirui/rendering/native_affine.py"
      - "src/swirui/rendering/scene.py"
      - "src/swirui/rendering/wgpu_renderer.py"
      - "src/swirui/rendering/factory.py"
      - "src/swirui/rendering/__init__.py"
      - "tests/test_affine_scene.py"
      - "tests/test_affine_compositor_traversal.py"
      - "tests/test_affine_path_renderer.py"
      - "tests/test_native_affine_contract.py"
      - "tests/test_windows_affine_contract.py"
      - "tests/test_windows_affine_paths.py"
      - ".github/workflows/affine-native.yml"

permissions:
  contents: read

concurrency:
  group: native-affine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-affine:
    name: Win32 PyO3 affine contract / Python 3.14
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install Python tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" maturin==1.15.0

      - name: Check native core
        run: cargo check --manifest-path native/Cargo.toml --all-targets

      - name: Test native affine Rust contract
        run: cargo test --manifest-path native/Cargo.toml --lib affine::tests shape::tests

      - name: Build PyO3 extension
        working-directory: native
        run: maturin build --release --interpreter python --out ../dist-native

      - name: Install PyO3 extension
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist-native\*.whl | Select-Object -First 1).FullName
          python -m pip install $wheel

      - name: Verify retained affine compositor contract
        run: pytest tests/test_affine_scene.py tests/test_affine_compositor_traversal.py tests/test_affine_path_renderer.py -q

      - name: Verify Python payload packing
        run: pytest tests/test_native_affine_contract.py -q

      - name: Verify real Python to native affine boundary
        run: pytest tests/test_windows_affine_contract.py tests/test_windows_affine_paths.py -q
