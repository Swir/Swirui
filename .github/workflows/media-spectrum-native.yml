name: Media Spectrum Native Gate

on:
  pull_request:
    paths:
      - "native/Cargo.toml"
      - "native/src/lib.rs"
      - "native/src/spectrum.rs"
      - "src/swirui/audio.py"
      - "src/swirui/microphone.py"
      - "src/swirui/widgets/spectrum.py"
      - "src/swirui/widgets/__init__.py"
      - "src/swirui/__init__.py"
      - "tests/test_media_spectrum.py"
      - "tests/test_windows_media_spectrum.py"
      - "benchmarks/media_spectrum_analysis.py"
      - "examples/media_spectrum_demo.py"
      - ".github/workflows/media-spectrum-native.yml"
  push:
    branches:
      - main
    paths:
      - "native/Cargo.toml"
      - "native/src/lib.rs"
      - "native/src/spectrum.rs"
      - "src/swirui/audio.py"
      - "src/swirui/microphone.py"
      - "src/swirui/widgets/spectrum.py"
      - "src/swirui/widgets/__init__.py"
      - "src/swirui/__init__.py"
      - "tests/test_media_spectrum.py"
      - "tests/test_windows_media_spectrum.py"
      - "benchmarks/media_spectrum_analysis.py"
      - "examples/media_spectrum_demo.py"
      - ".github/workflows/media-spectrum-native.yml"

permissions:
  contents: read

jobs:
  windows-media-spectrum:
    name: Spectrum / Rust analysis / wgpu retained scene / Python 3.14
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" maturin==1.15.0

      - name: Check native spectrum core on Windows
        run: cargo check --manifest-path native/Cargo.toml --all-targets

      - name: Test native spectrum analysis
        run: cargo test --manifest-path native/Cargo.toml spectrum --lib

      - name: Build PyO3 extension
        working-directory: native
        run: maturin build --release --interpreter python --out ../dist-native

      - name: Install PyO3 extension
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist-native\*.whl | Select-Object -First 1).FullName
          python -m pip install $wheel

      - name: Verify spectrum package
        run: pytest tests/test_media_spectrum.py tests/test_windows_media_spectrum.py -q --junitxml=media-spectrum-pytest.xml

      - name: Benchmark native spectrum analysis
        run: python benchmarks/media_spectrum_analysis.py

      - name: Upload spectrum diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-spectrum-pytest-${{ github.run_id }}
          path: media-spectrum-pytest.xml
          if-no-files-found: ignore
          retention-days: 7
