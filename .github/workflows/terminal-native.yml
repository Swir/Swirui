name: Terminal Native Gate

on:
  pull_request:
    paths:
      - "src/swirui/widgets/terminal.py"
      - "src/swirui/widgets/__init__.py"
      - "src/swirui/__init__.py"
      - "tests/test_terminal.py"
      - "tests/test_windows_terminal.py"
      - "benchmarks/terminal_scrollback.py"
      - "examples/terminal_demo.py"
      - ".github/workflows/terminal-native.yml"
  push:
    branches:
      - main
    paths:
      - "src/swirui/widgets/terminal.py"
      - "src/swirui/widgets/__init__.py"
      - "src/swirui/__init__.py"
      - "tests/test_terminal.py"
      - "tests/test_windows_terminal.py"
      - "benchmarks/terminal_scrollback.py"
      - "examples/terminal_demo.py"
      - ".github/workflows/terminal-native.yml"

permissions:
  contents: read

jobs:
  windows-terminal:
    name: Terminal / retained wgpu path / Python 3.14
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" maturin==1.15.0

      - name: Check native core on Windows
        run: cargo check --manifest-path native/Cargo.toml --all-targets

      - name: Build PyO3 extension
        working-directory: native
        run: maturin build --release --interpreter python --out ../dist-native

      - name: Install PyO3 extension
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist-native\*.whl | Select-Object -First 1).FullName
          python -m pip install $wheel

      - name: Verify terminal package
        run: pytest tests/test_terminal.py tests/test_windows_terminal.py -q --junitxml=terminal-pytest.xml

      - name: Benchmark scrollback virtualization
        run: python benchmarks/terminal_scrollback.py

      - name: Upload terminal diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-pytest-${{ github.run_id }}
          path: terminal-pytest.xml
          if-no-files-found: ignore
          retention-days: 7
