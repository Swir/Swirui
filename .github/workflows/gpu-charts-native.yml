name: GPU Charts Native Gate

on:
  pull_request:
    paths:
      - "src/swirui/widgets/charts.py"
      - "src/swirui/widgets/cartesian_chart.py"
      - "src/swirui/widgets/line_area_chart.py"
      - "src/swirui/widgets/bar_chart.py"
      - "src/swirui/widgets/radial_chart.py"
      - "src/swirui/widgets/advanced_charts.py"
      - "src/swirui/widgets/specialized_charts.py"
      - "src/swirui/widgets/streaming_charts.py"
      - "src/swirui/rendering/wgpu_renderer.py"
      - "native/src/shape.rs"
      - "native/src/renderer.rs"
      - "tests/test_windows_gpu_charts.py"
      - "examples/gpu_charts_demo.py"
      - ".github/workflows/gpu-charts-native.yml"
  push:
    branches:
      - main
    paths:
      - "src/swirui/widgets/charts.py"
      - "src/swirui/widgets/cartesian_chart.py"
      - "src/swirui/widgets/line_area_chart.py"
      - "src/swirui/widgets/bar_chart.py"
      - "src/swirui/widgets/radial_chart.py"
      - "src/swirui/widgets/advanced_charts.py"
      - "src/swirui/widgets/specialized_charts.py"
      - "src/swirui/widgets/streaming_charts.py"
      - "src/swirui/rendering/wgpu_renderer.py"
      - "native/src/shape.rs"
      - "native/src/renderer.rs"
      - "tests/test_windows_gpu_charts.py"
      - "examples/gpu_charts_demo.py"
      - ".github/workflows/gpu-charts-native.yml"

permissions:
  contents: read

jobs:
  windows-gpu-charts:
    name: GPU Charts / Win32 + wgpu / Python 3.14
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install Python tools
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -e ".[dev]" maturin==1.15.0

      - name: Check native core on Windows
        run: cargo check --manifest-path native/Cargo.toml --all-targets

      - name: Build PyO3 extension
        working-directory: native
        run: maturin build --release --interpreter python --out ../dist-native

      - name: Install PyO3 extension
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist-native\*.whl | Select-Object -First 1).FullName
          python -m pip install $wheel

      - name: Verify chart contracts and cross-family GPU submission
        run: >-
          pytest
          tests/test_cartesian_charts.py
          tests/test_radial_charts.py
          tests/test_advanced_charts.py
          tests/test_specialized_charts.py
          tests/test_streaming_charts.py
          tests/test_windows_gpu_charts.py
          -q

      - name: Compile explicit GPU chart example
        run: python -m py_compile examples/gpu_charts_demo.py
