name: Media Microphone Native Gate

on:
  pull_request:
    paths:
      - "native/Cargo.toml"
      - "native/src/lib.rs"
      - "native/src/audio.rs"
      - "native/src/microphone.rs"
      - "native/src/microphone_capture.rs"
      - "src/swirui/microphone.py"
      - "tests/test_media_microphone.py"
      - "tests/test_windows_media_microphone.py"
      - "benchmarks/media_microphone_buffer.py"
      - "examples/media_microphone_demo.py"
      - ".github/workflows/media-microphone-native.yml"
  push:
    branches:
      - main
    paths:
      - "native/Cargo.toml"
      - "native/src/lib.rs"
      - "native/src/audio.rs"
      - "native/src/microphone.rs"
      - "native/src/microphone_capture.rs"
      - "src/swirui/microphone.py"
      - "tests/test_media_microphone.py"
      - "tests/test_windows_media_microphone.py"
      - "benchmarks/media_microphone_buffer.py"
      - "examples/media_microphone_demo.py"
      - ".github/workflows/media-microphone-native.yml"

permissions:
  contents: read

jobs:
  windows-media-microphone:
    name: Microphone input / WASAPI / Win32 / Python 3.14
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" maturin==1.15.0

      - name: Check native microphone core on Windows
        run: cargo check --manifest-path native/Cargo.toml --all-targets

      - name: Test bounded native microphone core
        run: cargo test --manifest-path native/Cargo.toml microphone --lib

      - name: Build PyO3 extension
        working-directory: native
        run: maturin build --release --interpreter python --out ../dist-native

      - name: Install PyO3 extension
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist-native\*.whl | Select-Object -First 1).FullName
          python -m pip install $wheel

      - name: Verify microphone-input package
        run: pytest tests/test_media_microphone.py tests/test_windows_media_microphone.py -q --junitxml=media-microphone-pytest.xml

      - name: Benchmark native microphone validation
        run: python benchmarks/media_microphone_buffer.py

      - name: Upload microphone-input diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-microphone-pytest-${{ github.run_id }}
          path: media-microphone-pytest.xml
          if-no-files-found: ignore
          retention-days: 7
