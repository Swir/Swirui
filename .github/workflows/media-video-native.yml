name: Media Video Native Gate

on:
  pull_request:
    paths:
      - "native/src/lib.rs"
      - "native/src/video.rs"
      - "src/swirui/video.py"
      - "src/swirui/widgets/video_player.py"
      - "src/swirui/widgets/__init__.py"
      - "src/swirui/__init__.py"
      - "tests/test_media_video.py"
      - "tests/test_windows_media_video.py"
      - "benchmarks/media_video_playback.py"
      - "examples/media_video_demo.py"
      - ".github/workflows/media-video-native.yml"
  push:
    branches:
      - main
    paths:
      - "native/src/lib.rs"
      - "native/src/video.rs"
      - "src/swirui/video.py"
      - "src/swirui/widgets/video_player.py"
      - "src/swirui/widgets/__init__.py"
      - "src/swirui/__init__.py"
      - "tests/test_media_video.py"
      - "tests/test_windows_media_video.py"
      - "benchmarks/media_video_playback.py"
      - "examples/media_video_demo.py"
      - ".github/workflows/media-video-native.yml"

permissions:
  contents: read

jobs:
  windows-media-video:
    name: VideoPlayer / Rust timeline / Win32 / Python 3.14
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" maturin==1.15.0

      - name: Check native video core on Windows
        run: cargo check --manifest-path native/Cargo.toml --all-targets

      - name: Test native video timeline core
        run: cargo test --manifest-path native/Cargo.toml video --lib

      - name: Build PyO3 extension
        working-directory: native
        run: maturin build --release --interpreter python --out ../dist-native

      - name: Install PyO3 extension
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist-native\*.whl | Select-Object -First 1).FullName
          python -m pip install $wheel

      - name: Verify VideoPlayer package
        run: pytest tests/test_media_video.py tests/test_windows_media_video.py -q --junitxml=media-video-pytest.xml

      - name: Benchmark native timeline selection
        run: python benchmarks/media_video_playback.py

      - name: Upload VideoPlayer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-video-pytest-${{ github.run_id }}
          path: media-video-pytest.xml
          if-no-files-found: ignore
          retention-days: 7
