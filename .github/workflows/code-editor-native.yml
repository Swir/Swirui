name: Code Editor Native Gate

on:
  pull_request:
    paths:
      - "src/swirui/widgets/code_editor.py"
      - "src/swirui/widgets/__init__.py"
      - "src/swirui/__init__.py"
      - "tests/test_code_editor.py"
      - "tests/test_windows_code_editor.py"
      - "benchmarks/code_editor_large_document.py"
      - "examples/code_editor_demo.py"
      - ".github/workflows/code-editor-native.yml"
  push:
    branches:
      - main
    paths:
      - "src/swirui/widgets/code_editor.py"
      - "src/swirui/widgets/__init__.py"
      - "src/swirui/__init__.py"
      - "tests/test_code_editor.py"
      - "tests/test_windows_code_editor.py"
      - "benchmarks/code_editor_large_document.py"
      - "examples/code_editor_demo.py"
      - ".github/workflows/code-editor-native.yml"

permissions:
  contents: read

jobs:
  windows-code-editor:
    name: CodeEditor / retained wgpu path / Python 3.14
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" maturin==1.15.0

      - name: Check native core on Windows
        run: cargo check --manifest-path native/Cargo.toml --all-targets

      - name: Build PyO3 extension
        working-directory: native
        run: maturin build --release --interpreter python --out ../dist-native

      - name: Install PyO3 extension
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist-native\*.whl | Select-Object -First 1).FullName
          python -m pip install $wheel

      - name: Verify code editor package
        run: pytest tests/test_code_editor.py tests/test_windows_code_editor.py -q --junitxml=code-editor-pytest.xml

      - name: Benchmark large-document viewport
        run: python benchmarks/code_editor_large_document.py

      - name: Upload code editor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-editor-pytest-${{ github.run_id }}
          path: code-editor-pytest.xml
          if-no-files-found: ignore
          retention-days: 7
